<html>
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Minecraft Skin Viewer</title>
  <link rel="stylesheet" href="style.css?v=3" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/skinview3d@3.0.1/bundles/skinview3d.bundle.js"></script>
</head>
<body>

  <a href="https://github.com/7yxz/mcskinviewer" target="_blank" rel="noopener noreferrer" class="advancement-toast" id="advancement-toast"></a>

  <canvas id="skin_container"></canvas>

  <div class="nametag-wrapper" id="nametag-wrapper">
    <div class="nametag-plate" id="nametag-plate">
      <span id="nametag-sizer" class="nametag-sizer"></span>
      <input 
        type="text" 
        id="nametag-input" 
        class="nametag-input" 
        value="m5yx " 
        spellcheck="false" 
        autocomplete="off" 
      />
    </div>
  </div>

  <script src="app.js?v=3"></script>
</body>
</html>
